# Included from deployproxmox.yml in a play with serial: 1 (Proxmox joins one node at a time).
# The first node creates the cluster; the others join through its API (pvecm add + root password).

- name: PVE cluster - first node and its address
  set_fact:
    pve_first: "{{ groups['proxmox_hosts'][0] }}"
    pve_first_ip: "{{ hostvars[groups['proxmox_hosts'][0]]['ansible_ssh_host'] }}"

- name: PVE cluster - already a cluster member?
  shell: "test -f /etc/pve/corosync.conf"
  register: pve_member
  changed_when: false
  failed_when: false

- name: PVE cluster - create cluster {{ pve_cluster_name }} on the first node
  shell: "pvecm create {{ pve_cluster_name }}"
  when: inventory_hostname == pve_first and pve_member.rc != 0

# Join through the first node's API with the root password (Proxmox's standard method). This
# avoids writing SSH keys into /etc/pve (pmxcfs), which rejects appends and file creation from
# outside. The password prompt is answered by expect; the password is passed via the environment
# and never appears on the command line or in the build log.
- name: PVE cluster - install expect on the joining node
  shell: "dpkg -s expect >/dev/null 2>&1 || DEBIAN_FRONTEND=noninteractive apt-get install -y expect"
  when: inventory_hostname != pve_first and pve_member.rc != 0

- name: PVE cluster - join helper script
  copy:
    src: "{{ playbook_dir }}/roles/proxmox/files/pve-join.exp"
    dest: /root/trillian-pve-join.exp
    owner: root
    group: root
    mode: 0700
  when: inventory_hostname != pve_first and pve_member.rc != 0

- name: PVE cluster - read the first node's certificate fingerprint
  shell: "openssl x509 -in /etc/pve/local/pve-ssl.pem -noout -fingerprint -sha256 | cut -d= -f2"
  register: pve_first_fp
  delegate_to: "{{ pve_first }}"
  changed_when: false
  when: inventory_hostname != pve_first and pve_member.rc != 0

- name: PVE cluster - join {{ pve_cluster_name }} via {{ pve_first_ip }}
  shell: "expect /root/trillian-pve-join.exp pvecm add {{ pve_first_ip }} --fingerprint {{ pve_first_fp.stdout | trim }}"
  environment:
    PVE_JOIN_PASSWORD: "{{ hostvars[pve_first]['ansible_ssh_pass'] }}"
  when: inventory_hostname != pve_first and pve_member.rc != 0

- name: PVE cluster - wait until this node is in a quorate cluster
  shell: "pvecm status 2>/dev/null | grep -Eq 'Quorate:[[:space:]]+Yes'"
  register: pve_quorate
  until: pve_quorate.rc == 0
  retries: 30
  delay: 10
  changed_when: false
