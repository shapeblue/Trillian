# Proxmox VE package sources (pve-no-subscription), per Debian codename.
# Override with mirrors if the nodes have no internet access.
pve_repo_url: "http://download.proxmox.com/debian/pve"
pve_key_url_bookworm: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
pve_key_url_trixie: "https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg"

# Interfaces: same layout as Trillian's KVM hosts
pve_mgmt_if: "eth0"      # management_network -> vmbr0 (IP, cluster traffic, web UI)
pve_trunk_if: "eth1"     # guest_public_network trunk -> vmbr1 (VLAN-aware, no IP)

# Local VM-disk storage on the data disk: VG "pve", thin pool "data", storage "local-lvm"
# (the same names a Proxmox ISO installation uses). Empty = detect the unused disk.
pve_data_disk: ""
