- debug:
    msg: "SUSE Specific MySQL Build"
  tags:
    - mysql
    - mysqlconf

- name: wait for ssh
  local_action: wait_for port=22 host="{{ ansible_ssh_host }}" timeout=300 connect_timeout=5
  tags:
    - mysql
    - mysqlconf

- name: now i'm connected, get facts
  setup:
  tags:
    - mysql
    - mysqlconf

# The Ansible mysql_* modules (secure_mysql.yml) need a MySQL driver. python3-mysqlclient
# (MySQLdb) is in the SLES ServerApps media; PyMySQL is not in any SLES repo.
- name: Install the MySQL python driver (python3-mysqlclient from the SLES ServerApps media)
  shell: "zypper install -y python3-mysqlclient"
  ignore_errors: yes
  tags:
    - mysql
    - mysqlconf

- name: Fall back to pip for the MySQL python driver when zypper has no package for it
  shell: "python3 -c 'import MySQLdb' 2>/dev/null || (zypper install -y python3-pip && python3 -m pip install mysqlclient)"
  ignore_errors: yes
  tags:
    - mysql
    - mysqlconf

- name: Ensure selinux python bindings are installed (Ansible requirement)
  shell: "zypper install -y python3-selinux"
  tags:
    - mysql
    - mysqlconf
  ignore_errors: yes

- include_tasks: ../../../tasks/configure_apparmor.yml
  tags:
    - mysql
    - mysqlconf

- name: Check if mysql server is installed
  shell: rpm -q mysql-server
  register: mysql_check
  failed_when: false
  changed_when: false

- name: Ensure mysql server is installed
  shell: "zypper install -y mysql-server"
  register: mysqlinstalled
  when: mysql_check.rc != 0
  tags:
    - mysql
    - mysqlconf

- name: replace MySQL my.cnf using Template
  template:
    src: mariadb-suse-my.cnf.j2
    dest: /etc/my.cnf
  when: mysqlinstalled.changed
  tags:
    - mysql
    - mysqlconf

- name: Ensure MySQL service is started and set to start on boot
  service:
    name: mysql
    state: restarted
    enabled: yes
  when: mysqlinstalled.changed
  tags:
    - mysql
    - mysqlconf

# - name: Nuke everything since it's starting from scratch
#   shell: rm -rf /var/lib/mysql/*

- name: set root password
  shell: mysql -h localhost -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED BY 'P@ssword123';FLUSH PRIVILEGES;"
  when: mysqlinstalled.changed
  tags:
    - mysql
    - mysqlconf

- name: grant permissions
  shell: mysql -h localhost -u root -pP@ssword123 -e "CREATE USER 'root'@'%' IDENTIFIED BY 'P@ssword123';GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;FLUSH PRIVILEGES"
  ignore_errors: yes
  when: mysqlinstalled.changed
  tags:
    - mysql
    - mysqlconf
