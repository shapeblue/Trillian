# EVPN on openSUSE Leap 15.x: install FRR (distribution OSS repository by default).
# evpn_frr_repo_baseurl = an optional zypper repository to use instead/in addition.
# Included from kvm_vxlan_evpn.yml.

- name: EVPN - add FRR zypper repository
  shell: "zypper lr trillian-frr >/dev/null 2>&1 || zypper --non-interactive addrepo --no-gpgcheck --refresh '{{ evpn_frr_repo_baseurl }}' trillian-frr"
  when: evpn_frr_repo_baseurl | default('') | length > 0

- name: EVPN - install FRR
  shell: "rpm -q frr >/dev/null 2>&1 || zypper --non-interactive --gpg-auto-import-keys install frr"
  register: evpn_frr_zypper
  until: evpn_frr_zypper.rc == 0
  retries: 3
  delay: 10
