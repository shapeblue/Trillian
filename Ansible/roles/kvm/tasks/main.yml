- name: wait for VM to be alive
  shell: "ping {{ ansible_ssh_host }} -c 1"
  register: pong
  until: pong.rc == 0
  retries: "{{ ssh_retries }}"

- name: Wait for SSH
  local_action: wait_for port=22 host="{{ ansible_ssh_host }}" timeout={{ ssh_retries }} connect_timeout=5
  tags:
    - kvm
  delegate_to: localhost

- name: symlink /usr/bin/python -> /usr/bin/python3
  raw: |
    if [ -f /usr/bin/python3 ] && [ ! -f /usr/bin/python ]; then
      ln --symbolic /usr/bin/python3 /usr/bin/python;
    fi
  become: true

- name: Now Im connected, get facts
  os_facts:
  tags:
    - kvm

# For some weird reason, it thinks SUSE is Ubuntu
- name: Check if SUSE
  shell: cat /etc/os-release | grep -i suse
  register: result
  when: ansible_distribution == 'Ubuntu'
  ignore_errors: yes

- name: Set distro as SUSE
  set_fact:
      ansible_distribution: "SUSE"
  when: ansible_distribution == 'Ubuntu' and result is succeeded

# KVM host OS support for kvm_vxlan_evpn:
#   evpn_os_implemented : OS task files include the EVPN tasks and the OS-specific parts exist
#   evpn_os_verified    : additionally passed a full lab build (guest + public VXLAN)
# An implemented but not yet verified OS can be test-built with evpn_allow_untested_os=yes.
- name: Read /etc/os-release for kvm_vxlan_evpn (non-EL; os_facts has no version on SUSE)
  shell: ". /etc/os-release && echo \"${ID}|${VERSION_ID}\""
  register: evpn_os_release
  changed_when: false
  when:
    - kvm_vxlan_evpn | default(false) | bool
    - ansible_distribution not in ['CentOS', 'Red Hat Enterprise Linux']
  tags:
    - kvm

# ids: el<major>, ubuntu<version> (e.g. ubuntu22.04), opensuse-leap<major> (e.g. opensuse-leap15)
- name: Determine KVM host OS id for kvm_vxlan_evpn
  set_fact:
    evpn_os_id: "{{ ('el' ~ ansible_distribution_major_version) if ansible_distribution in ['CentOS', 'Red Hat Enterprise Linux'] else (evpn_os_release.stdout.split('|')[0] ~ (evpn_os_release.stdout.split('|')[1].split('.')[0] if evpn_os_release.stdout.split('|')[0].startswith('opensuse') else evpn_os_release.stdout.split('|')[1])) }}"
    evpn_os_implemented: ['el8', 'el9', 'el10', 'ubuntu22.04', 'ubuntu24.04', 'opensuse-leap15']
    evpn_os_verified: ['el9']
  when: kvm_vxlan_evpn | default(false) | bool
  tags:
    - kvm

- name: Check KVM host OS supports kvm_vxlan_evpn
  fail:
    msg: >-
      kvm_vxlan_evpn is enabled but {{ inventory_hostname }} runs {{ ansible_distribution }}
      {{ ansible_distribution_version }} ({{ evpn_os_id }}). Verified: {{ evpn_os_verified | join(', ') }}.
      Implemented but not yet verified: {{ evpn_os_implemented | difference(evpn_os_verified) | join(', ') }}
      (test with evpn_allow_untested_os=yes). Otherwise choose a supported KVM_OS or pass kvm_vxlan_evpn=no.
  when:
    - kvm_vxlan_evpn | default(false) | bool
    - evpn_os_id not in evpn_os_verified
    - not ( (evpn_allow_untested_os | default(false) | bool) and (evpn_os_id in evpn_os_implemented) )
  tags:
    - kvm

