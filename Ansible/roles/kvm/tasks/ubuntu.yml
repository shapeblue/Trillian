- name: gather OS facts
  os_facts:

#- name: Set hostname pt1
#  hostname:
#    name: "{{ inventory_hostname }}"
#    when: ansible_distribution_major_version|int != 20

- name: Set hostname pt2
  shell: "hostnamectl set-hostname {{ inventory_hostname }}"

- name: set apt repo
  template:
    src: "{{ inventory_dir }}/templates/{{ item }}-u18.j2"
    dest: "/etc/apt/{{item}}"
  with_items:
    - "sources.list"
  when: ansible_distribution_version is version('18.04','==')

- name: ensure apt keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: download OS repo key
  get_url:
    url: "{{ os_repo }}/release.asc"
    dest: /etc/apt/keyrings/os_repo.asc
    mode: '0644'

- name: download CloudStack KVM repo key
  get_url:
    url: "{{ baseurl_kvm }}Release.gpg"
    dest: /etc/apt/keyrings/cloudstack-kvm.gpg
    mode: '0644'

- name: fetch extra CloudStack keys from keyserver (modern safe fallback)
  shell: |
    gpg --keyserver keyserver.ubuntu.com \
        --recv-keys 86F44E2A BDF0E176584DF93F
    gpg --export 86F44E2A BDF0E176584DF93F \
    | gpg --dearmor \
    | tee /etc/apt/keyrings/cloudstack-extra.gpg > /dev/null
  args:
    creates: /etc/apt/keyrings/cloudstack-extra.gpg
  ignore_errors: true

- name: Add openjdk-ppa repository into sources list.
  apt_repository:
    repo: "ppa:webupd8team/java"
    state: present
  when: ansible_distribution_major_version|int < 20

- name: Add openjdk-ppa repository into sources list.
  apt_repository:
    repo: "ppa:openjdk-r/ppa"
    state: present
  when: ansible_distribution_major_version|int == 16

- name: Run the equivalent of "apt-get update" as a separate step
  apt:
    update_cache: yes

- name: Install basic utilities and tools - all OS versions
  apt:
    pkg: "{{ item }}"
    state: latest
    update_cache: yes
  with_items:
    - openssh-client
    - telnet
    - tcpdump
    - qemu-system-x86
    - parted

- name: Install utilities and tools for Linux network namespace
  apt:
    pkg: "{{ item }}"
    state: latest
    update_cache: yes
  with_items:
    - iproute2
    - iptables
    - arping
    - dnsmasq
    - haproxy
    - apache2
    - util-linux
    - radvd
  ignore_errors: yes

- name: Stop dnsmasq and haproxy and apache2 and radvd services
  shell: systemctl stop dnsmasq haproxy apache2 radvd && systemctl disable dnsmasq haproxy apache2 radvd
  ignore_errors: yes

- name: Install packages for UEFI
  apt:
    pkg: "{{ item }}"
    state: latest
    update_cache: yes
  with_items:
    - ovmf
    - swtpm
  when: ansible_distribution_major_version|int >= 22

- name: Install basic utilities and tools - pre bionic
  apt:
    pkg: "{{ item }}"
    state: latest
    update_cache: yes
  with_items:
    - openntpd
    - traceroute
    - iptables-persistent
  when: ansible_distribution_version is version('18.04','<')

- set_fact: java_ver="{{ kvm_java_ver }}"
- set_fact: java_path="{{ kvm_java_path }}"

- debug: msg="Java version required is {{ java_ver }}"

- name: Ensure correct open-jdk is installed
  apt:
    pkg: "{{ kvm_java_path }}"
    state: latest
    update_cache: yes

- include_tasks: ./add_local_storage.yml
  when: use_local_storage
  tags:
    - kvm

- name: workaround ssh crypo issues
  lineinfile:
    path: /etc/ssh/sshd_config
    line: "{{ item }}"
  with_items:
    - "PubkeyAcceptedKeyTypes=+ssh-dss"
    - "HostKeyAlgorithms=+ssh-dss"
    - "KexAlgorithms=+diffie-hellman-group1-sha1"
  tags:
    - kvm
  when: ansible_distribution_version is version('20.04','<=')

- name: Restart sshd
  systemd:
    name: sshd
    state: restarted
  when: ansible_distribution_version is version('20.04','<=')
  tags:
    - kvm

- name: Wait for SSH
  local_action: wait_for port=22 host="{{ ansible_ssh_host }}" timeout={{ ssh_retries }} connect_timeout=5
  when: ansible_distribution_version is version('20.04','<=')
  tags:
    - kvm
  delegate_to: localhost

- name: Added network instances file to precise/trusty/xenial
  template: src=interfaces.j2 dest="/etc/network/interfaces"
  when: ansible_distribution_version is version('16.04','<=') and kvm_network_mode == "bridge"

## start block

- name: netplan on Ubuntu 18 onwards
  block:

  - name: write netplan
    shell: rm -rf  /etc/netplan/*

  - name: write netplan
    template:
      src: netplan.j2
      dest: /etc/netplan/00-trillian-config.yaml

  - name: apply netplan
    command: netplan apply

  when: ansible_distribution_version is version('18.04','>=') and kvm_network_mode == "bridge"

## end block

## OVS mode also joins the host up to OVN automatically - there is no
## separate "ovn" kvm_network_mode, OVN is just how the guest network on
## an OVS host is wired once Ansible has finished with it (Steps B/C).
- name: OVS (+ OVN) on Ubuntu 18 onwards
  block:

  - name: Install OVS and OVN host packages
    apt: pkg={{ item }} state=present
    with_items:
      - openvswitch-switch
      - ovn-host
      - ifupdown

  - name: Start OVS
    systemd:
      name: openvswitch-switch
      state: started
      enabled: yes

  - name: write netplan (cloudbr0/cloudbr1 + eth1.2000 for OVN's Geneve encap)
    shell: rm -rf  /etc/netplan/*

  - name: write netplan
    template:
      src: netplan-ovs.j2
      dest: /etc/netplan/00-trillian-config.yaml

  - name: replace cloudbr1 address
    replace:
      dest="/etc/netplan/00-trillian-config.yaml"
      regexp="cloudbr1.ipaddress"
      replace="{{ ansible_ssh_host | replace('10.0.', '10.250.') | replace('10.1.', '10.251.') }}/20"
      backup=no

  - name: apply netplan
    command: netplan apply

  - name: pause for eth1.2000 to come up before reading its address
    wait_for:
      timeout: 5
    delegate_to: localhost

  - name: work out the OVN controller IP (mgmt2/secondary_cs_manager), unless overridden
    set_fact:
      ovn_controller_ip: "{{ hostvars[groups['secondary_cs_manager'][0]]['ansible_ssh_host'] }}"
    when: not ovn_controller_ip

  - name: read the eth1.2000 IP (used as the OVN Geneve encapsulation IP)
    shell: "ip -4 addr show eth1.2000 | awk '/inet/ {print $2}' | cut -d/ -f1"
    register: ovn_encap_ip
    changed_when: false

  - name: Set OVS system-id
    shell: "ovs-vsctl set open_vswitch . external_ids:system-id={{ inventory_hostname }}"
    changed_when: true

  - name: Point OVS at the OVN Southbound DB
    shell: >
      ovs-vsctl set open_vswitch . external_ids:ovn-remote="tcp:{{ ovn_controller_ip }}:{{ ovn_sb_port }}"
    changed_when: true

  - name: Configure Geneve encapsulation on eth1.2000
    shell: >
      ovs-vsctl set open_vswitch . external_ids:ovn-encap-type="{{ ovn_encap_type }}"
      external_ids:ovn-encap-ip="{{ ovn_encap_ip.stdout }}"
    changed_when: true

  - name: Map the provider network to cloudbr1
    shell: 'ovs-vsctl set open_vswitch . external_ids:ovn-bridge-mappings="{{ ovn_bridge_mappings }}"'
    changed_when: true

  - name: Start OVN controller agent
    systemd:
      name: ovn-controller
      state: started
      enabled: yes

  - name: UFW - allow Geneve tunnel traffic from other chassis
    ufw:
      rule: allow
      proto: udp
      port: "6081"
    ignore_errors: yes

  when: kvm_network_mode == "ovs"

## end block

- name: UFW firerules
  shell: "ufw allow proto tcp from any to any port {{ item }}"
  with_items:
    - "22"
    - "1798"
    - "16509"
    - "5900:6100"
    - "49152:49216"

- name: Add CloudStack repository into sources list.
  apt_repository:
    repo: 'deb "{{ baseurl_kvm }}" /'
    state: present
    validate_certs: no
  ignore_errors: yes
  when: ansible_distribution_version is version('20.04','<')

- name: Add CloudStack repository into sources list.
  shell: echo "deb [signed-by=/etc/apt/keyrings/cloudstack-extra.gpg] {{ baseurl_kvm }} /" > /etc/apt/sources.list.d/cloudstack.list
  when: (ansible_distribution_major_version|int >= 20) and ("download.cloudstack.org" not in baseurl_cloudstack or "/testing/" in baseurl_cloudstack)

- name: Add CloudStack repository into sources list.
  shell: echo "deb [signed-by=/etc/apt/keyrings/cloudstack.asc] {{ baseurl_cloudstack }} noble {{ env_cs_minor_version }}" > /etc/apt/sources.list.d/cloudstack.list
  when: ansible_distribution_major_version|int >= 20 and "download.cloudstack.org" in baseurl_cloudstack and "/testing/" not in baseurl_cloudstack

- name: download CloudStack signing key
  get_url:
    url: "https://download.cloudstack.org/release.asc"
    dest: /etc/apt/keyrings/cloudstack.asc
    mode: '0644'
    validate_certs: true
  when: '"download.cloudstack.org" in baseurl_cloudstack'

- name: Run the equivalent of "apt-get update" as a separate step
  apt:
    update_cache: yes

- name: get CloudStack package version (for example, 4.20.2.0-shapeblue0)
  shell: |
    set -o pipefail
    apt list -a cloudstack-common | awk '{print $2}' | grep '^{{ env_cs_security_version }}' | head -n1
  args:
    executable: /bin/bash
  register: cloudstack_package_version
  changed_when: false
  failed_when: cloudstack_package_version.stdout | length == 0

- name: Installs cloudstack-agent
  apt:
    pkg: "{{ item }}={{ cloudstack_package_version.stdout }}"
    state: present
    allow_unauthenticated: yes
  with_items:
    - cloudstack-agent
    - cloudstack-common

# no need to remove - same as for CentOS
#- name: remove CloudStack repository into sources list.
#  apt_repository:
#    repo: 'deb {{ baseurl_kvm }} /'
#    state: absent

#- name: Run the equivalent of "apt-get update" as a separate step
#  apt:
#    update_cache: yes

- name: Configure agent.properties for OVS
  lineinfile:
    path: /etc/cloudstack/agent/agent.properties
    line: "{{ item }}"
  with_items:
    - "network.bridge.type=openvswitch"
    - "libvirt.vif.driver=com.cloud.hypervisor.kvm.resource.OvsVifDriver"
  when: kvm_network_mode == "ovs"

# OVN owns the guest network via its own integration bridge (br-int),
# created automatically by ovn-controller - it is NOT one of our netplan
# bridges, so this only makes sense once the OVS(+OVN) block above has run.
- name: Configure agent.properties for OVN guest network device
  lineinfile:
    path: /etc/cloudstack/agent/agent.properties
    line: "guest.network.device=br-int"
  when: kvm_network_mode == "ovs"

- name: Blacklist bridge module post agent install
  template:
    src=bridge-blacklist.j2
    dest="/etc/modprobe.d/bridge-blacklist.conf"
  when: kvm_network_mode == "ovs"

- name: Updated /etc/libvirt/libvirtd.conf
  lineinfile: dest=/etc/libvirt/libvirtd.conf regexp="#listen_tls = 0" line="listen_tls = 0"

- name: Updated /etc/libvirt/libvirtd.conf
  lineinfile: dest=/etc/libvirt/libvirtd.conf regexp='#listen_tcp = 1' line='listen_tcp = 1'

- name: Updated /etc/libvirt/libvirtd.conf
  lineinfile: dest=/etc/libvirt/libvirtd.conf regexp='#tcp_port= "16509"' line='tcp_port = "16509"'

- name: Updated /etc/libvirt/libvirtd.conf
  lineinfile: dest=/etc/libvirt/libvirtd.conf regexp='#auth_tcp = "sasl"' line='auth_tcp = "none"'

- name: Updated /etc/libvirt/libvirtd.conf
  lineinfile: dest=/etc/libvirt/libvirtd.conf regexp='#mdns_adv = 1' line='mdns_adv = 0'

- name: Updated /etc/libvirt/libvirtd.conf
  lineinfile:
    dest: "/etc/libvirt/libvirtd.conf"
    line: 'log_outputs="1:file:/var/log/libvirt/libvirtd.log"'

- name: Updated /etc/default/libvirt-bin in trusty
  lineinfile:
    dest: "/etc/default/libvirt-bin"
    regexp: 'libvirtd_opts="-d"'
    line: 'libvirtd_opts="-d -l"'
  when: ansible_distribution_version is version('14.04','==')

- name: Update /etc/default/libvirtd in bionic
  lineinfile:
    dest: "/etc/default/libvirtd"
    regexp: '.*libvirtd_opts=*'
    line: 'libvirtd_opts="-l"'
  when: ansible_distribution_version is version('16.04','>=') and ansible_distribution_version is version('22.04','<')

- name: Update /etc/default/libvirtd in Ubuntu 22.04
  lineinfile:
    dest: "/etc/default/libvirtd"
    regexp: '^LIBVIRTD_ARGS=*'
    line: 'LIBVIRTD_ARGS="-l"'
  when: ansible_distribution_version is version('22.04','>=')

#- name: Updated /etc/init/libvirt-bin.conf
#  lineinfile: dest=/etc/init/libvirt-bin.conf regexp='env libvirtd_opts="-d"' line='env libvirtd_opts="-d -l"'

- name: update /etc/libvirt/qemu.conf
  lineinfile: dest=/etc/libvirt/qemu.conf regexp='#vnc_listen = "0.0.0.0"' line='vnc_listen = "0.0.0.0"'

- name: Symlink to disable
  file: src=/etc/apparmor.d/usr.sbin.libvirtd dest=/etc/apparmor.d/disable/usr.sbin.libvirtd state=link

- name: Symlink to disable
  file: src=/etc/apparmor.d/usr.lib.libvirt.virt-aa-helper dest=/etc/apparmor.d/disable/usr.lib.libvirt.virt-aa-helper state=link

- name: Apparmor parser libvirt
  shell: apparmor_parser -R /etc/apparmor.d/usr.sbin.libvirtd
  ignore_errors: yes

- name: Apparmor parser libvirt helper
  shell: apparmor_parser -R /etc/apparmor.d/usr.lib.libvirt.virt-aa-helper
  ignore_errors: yes

- name: Delete DHCP leases file - bionic onwards
  file: path={{ item }} state=absent
  with_items:
    - "/var/lib/dhcp/dhclient.leases"
    - "/run/systemd/netif/leases"
  when: ansible_distribution_version is version('18.04','>=')

- name: copy uefi.properties
  copy:
    src: uefi.properties.Ubuntu
    dest: /etc/cloudstack/agent/uefi.properties
    mode: 0644
  when: ansible_distribution_major_version|int >= 22

- name: restart machine (Ubuntu networking restart bug #1301015)
  command: shutdown -r now "Ansible updates triggered"
  async: 0
  poll: 0
  ignore_errors: true
  when: kvm_network_mode == "ovs"

- name: wait for ssh
  wait_for_connection:
    delay: 120
    sleep: 5
    timeout: 900
    connect_timeout: 2
  when: (not use_phys_hosts)

# Kernel 5.8+, because the stock kernel + EPYC CPU = can't start any VM on the host
- include_tasks: ./ubuntu_custom_kernel.yml
  when: ansible_distribution_version is version('20.04','==')
  tags:
    - kvm
