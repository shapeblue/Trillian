# EVPN on EL (8, 9, 10): tcp/179 + udp/4789 only from the environment's peers
# (firewalld or iptables, following use_firewalld). Included from kvm_vxlan_evpn.yml.

- name: EVPN - remove any open-to-all BGP/VXLAN ports (firewalld)
  shell: "firewall-cmd --permanent --zone=public --remove-port=179/tcp --remove-port=4789/udp || true"
  when: use_firewalld | bool

- name: EVPN - allow BGP/VXLAN only from environment peers (firewalld)
  shell: >-
    firewall-cmd --permanent --zone=public
    --add-rich-rule='rule family="ipv4" source address="{{ item[0] }}/32" port port="{{ item[1].port }}" protocol="{{ item[1].proto }}" accept'
  with_nested:
    - "{{ evpn_fw_peers }}"
    - [ { proto: tcp, port: 179 }, { proto: udp, port: 4789 } ]
  when: use_firewalld | bool

- name: EVPN - reload firewalld
  shell: "firewall-cmd --reload"
  when: use_firewalld | bool

- name: EVPN - allow BGP/VXLAN only from environment peers (iptables chain TRILLIAN-EVPN)
  shell: |
    iptables -N TRILLIAN-EVPN 2>/dev/null || true
    iptables -F TRILLIAN-EVPN
    {% for peer in evpn_fw_peers %}
    iptables -A TRILLIAN-EVPN -s {{ peer }}/32 -j ACCEPT
    {% endfor %}
    iptables -A TRILLIAN-EVPN -j DROP
    iptables -C INPUT -p udp --dport 4789 -j TRILLIAN-EVPN 2>/dev/null || iptables -I INPUT -p udp --dport 4789 -j TRILLIAN-EVPN
    iptables -C INPUT -p tcp --dport 179 -j TRILLIAN-EVPN 2>/dev/null || iptables -I INPUT -p tcp --dport 179 -j TRILLIAN-EVPN
  when: not (use_firewalld | bool)

- name: EVPN - save iptables rules
  shell: "iptables-save > /etc/sysconfig/iptables"
  when: not (use_firewalld | bool)
