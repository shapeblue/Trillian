- debug:
    msg: "SUSE Specific Management Server Build"

- name: Ensure selinux python bindings are installed (Ansible requirement)
  shell: "zypper install -y python3-selinux"
  ignore_errors: yes

- include_tasks: ../../../tasks/configure_apparmor.yml

- name: Allow connections on management server required ports with firewall
  shell: "firewall-cmd --zone=public --add-port={{ item }}/tcp --permanent"
  with_items:
    - "3306"
    - "8080"
    - "8096"
    - "8250"
    - "8443"
    - "9090"
  ignore_errors: yes

- name: Stop firewalld SUSE
  service:
    name: firewalld
    state: stopped
    enabled: no
  when: use_firewalld|bool == False

- name: Ensure CA Certs are latest
  shell: "zypper install -y ca-certificates"

- name: install haveged to get entropy
  shell: "zypper install -y haveged"

# cloudstack-management requires rng-tools. It is not in the enabled SUSE repositories, so when zypper
# cannot install it, install the openSUSE Leap 15.6 package directly (as done manually on mgmt1).
- name: install rng-tools to get entropy
  shell: |
    rpm -q rng-tools >/dev/null 2>&1 && exit 0
    zypper install -y rng-tools >/dev/null 2>&1 && exit 0
    # The openSUSE RPM is signed with a key the SLES hosts do not have; skip the signature check for this one package only
    cd /tmp && wget -q "{{ rng_tools_rpm_url }}" -O rng-tools.rpm && zypper --no-gpg-checks install -y ./rng-tools.rpm
  args:
    executable: /bin/bash
  vars:
    rng_tools_rpm_url: https://download.opensuse.org/distribution/leap/15.6/repo/oss/x86_64/rng-tools-5-bp156.3.7.x86_64.rpm

# cloudstack-management requires (tzdata-java or timezone-java). Neither is in the enabled SUSE repositories
# on SLES 15.7, so when zypper cannot install it, install the openSUSE Leap 15.6 timezone-java package directly.
- name: install timezone-java for the management server
  shell: |
    rpm -q timezone-java >/dev/null 2>&1 && exit 0
    rpm -q tzdata-java >/dev/null 2>&1 && exit 0
    zypper install -y timezone-java >/dev/null 2>&1 && exit 0
    # The openSUSE RPM is signed with a key the SLES hosts do not have; skip the signature check for this one package only
    cd /tmp && wget -q "{{ timezone_java_rpm_url }}" -O timezone-java.rpm && zypper --no-gpg-checks install -y ./timezone-java.rpm
  args:
    executable: /bin/bash
  vars:
    timezone_java_rpm_url: https://download.opensuse.org/distribution/leap/15.6/repo/oss/noarch/timezone-java-2024a-150000.75.28.1.noarch.rpm

- name: determine number of db hosts
  set_fact: num_xen_hosts="{{ groups['xenserver_hosts'] | length }}"

- name: update lvm2 as fix for bugzilla.redhat.com/show_bug.cgi?id=1294128
  shell: "zypper install -y lvm2"

- name: install qemu-tools
  shell: "zypper install -y qemu-tools"

- debug: msg="Set Java on VM"
- set_fact: java_ver="{{ mgmt_java_ver }}"
- set_fact: java_path="{{ mgmt_java_path }}"
- include_tasks: ../../../tasks/set_java.yml
  when: force_java

- debug:
    msg: "env_cs_distribution - {{ env_cs_distribution }}"
- include_tasks: ./suse-acs.yml
  when: env_cs_distribution == "cs"

# Don't really need suse support for ccp

- name: ensure rpcbind in installed
  shell: "zypper install -y rpcbind"

- name: ensure rpcbind in started
  service:
    name: rpcbind
    state: started
    enabled: yes

- debug: msg="Some Marvin Stuff"
  when: ((num_marv_hosts | int) > 0)

- name: Ensure sshpass is installed
  shell: |
    rpm -q sshpass >/dev/null 2>&1 && exit 0
    zypper install -y sshpass >/dev/null 2>&1 && exit 0
    # The openSUSE RPM is signed with a key the SLES hosts do not have; skip the signature check for this one package only
    cd /tmp && wget -q "{{ sshpass_rpm_url }}" -O sshpass.rpm && zypper --no-gpg-checks install -y ./sshpass.rpm
  args:
    executable: /bin/bash
  vars:
    sshpass_rpm_url: https://download.opensuse.org/distribution/leap/15.6/repo/oss/x86_64/sshpass-1.10-bp156.1.5.x86_64.rpm
  when: ((num_marv_hosts | int) > 0)

- name: Open 8096 when Marvin is required
  shell: "iptables -I INPUT -p tcp -m tcp --dport 8096 -j ACCEPT && iptables-save > /etc/sysconfig/iptables"
  when: ((num_marv_hosts | int) > 0)
