####################################################################
# CLVM primary storage. Shared LVM (lvmlockd + sanlock) on a LUN that the
# management server exports from a data disk, one volume group per cluster.
#
#   clvm_part: target - run on the management server, exports the data disk
#   clvm_part: host   - run on the KVM hosts, logs in and creates/starts the VG
####################################################################

- name: Get OS facts
  os_facts:
  tags:
    - clvm

- name: Work out the KVM hosts in the cluster
  include_tasks: ./cluster_hosts.yml
  tags:
    - clvm

- name: Export the CLVM data disk over iSCSI
  include_tasks: ./target.yml
  when: clvm_part == "target"
  tags:
    - clvm

- name: Configure KVM hosts for the CLVM volume group
  include_tasks: ./host.yml
  when: clvm_part == "host"
  tags:
    - clvm
