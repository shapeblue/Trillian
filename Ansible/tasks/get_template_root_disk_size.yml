####################################################################
# Shared task: look up a template's size and, if it is smaller than
# 10GB, set a fact so the caller can pass root_disk_size: 10 to the
# ngine_io.cloudstack.instance module (otherwise a deployed VM inherits
# the template's own, possibly tiny, root disk size).
#
# Expects (from the including task, via `vars:`):
#   rds_template - the template name to look up
#   rds_fact     - the name of the fact to set (undefined/omit when
#                  the template is already >= 10GB)
####################################################################

- name: "Look up size of template {{ rds_template }}"
  shell: |
    set -o pipefail
    cmk listTemplates templatefilter=all projectid=-1 name="{{ rds_template }}" | \
      jq -r ".template[0].size"
  args:
    executable: /bin/bash
  register: rds_template_size_result
  changed_when: false

- name: "Set {{ rds_fact }} when {{ rds_template }} is smaller than 10GB"
  set_fact:
    "{{ rds_fact }}": 10
  when: (rds_template_size_result.stdout | trim | int) < (10 * 1024 * 1024 * 1024)
