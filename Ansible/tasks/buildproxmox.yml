# Builds the standalone Proxmox VE nodes (groups['proxmox_hosts']) in the parent cloud:
# same networks as Trillian KVM hosts, plus a data disk for local-lvm.
# Used by deployvms.yml (proxmox_standalone=yes) and deployproxmox.yml.
# Expects inventory entries with <name>-ip / <name>-instance_name placeholders.

- name: Proxmox - check the Debian template exists in linux_os and is Debian 12 or 13
  fail:
    msg: "pve_os={{ pve_os }} must be a linux_os key for Debian 12 (Proxmox VE 8) or Debian 13 (Proxmox VE 9), e.g. d12 or d13."
  when: (pve_os not in linux_os) or (linux_os[pve_os].os not in ['debian12', 'debian13'])

- name: Proxmox - check node count and cluster name
  fail:
    msg: "pve_nodes must be 1-16 and pve_cluster_name ('{{ pve_cluster_name }}') 1-15 characters."
  when: (groups['proxmox_hosts'] | length < 1) or (groups['proxmox_hosts'] | length > 16) or (pve_cluster_name | length < 1) or (pve_cluster_name | length > 15)

- name: Proxmox - show what will be built
  debug:
    msg: "Proxmox VE cluster '{{ pve_cluster_name }}': {{ groups['proxmox_hosts'] | join(', ') }} from template '{{ linux_os[pve_os].template }}' in project {{ build_project }}"

- name: Proxmox - build nodes (stopped, so the data disk can be attached first)
  local_action:
    module: cs_instance
    name: "{{ item }}"
    service_offering: "{{ pve_service_offering }}"
    template: "{{ linux_os[pve_os].template }}"
    hypervisor: "{{ management_vm_hypervisor }}"
    project: "{{ build_project }}"
    zone: "{{ build_zone }}"
    keyboard: "{{ build_keyboard }}"
    tags:
      - { key: env_name, value: "{{ env_name_clean }}" }
      - { key: env_uuid, value: "{{ env_uuid }}" }
      - { key: env_user, value: "{{ env_user }}" }
      - { key: role, value: "proxmox" }
    networks:
      - "{{ management_network }}"
      - "{{ guest_public_network }}"
    state: stopped
    api_timeout: 120
  with_items: "{{ groups['proxmox_hosts'] }}"
  register: pve_retval

- name: Proxmox - add local data disk (becomes Proxmox storage local-lvm)
  local_action:
    module: cs_volume
    project: "{{ build_project }}"
    zone: "{{ build_zone }}"
    name: "{{ item.name }}-data"
    disk_offering: "{{ pve_data_disk_offering }}"
    size: "{{ pve_data_disk_size }}"
    vm: "{{ item.name }}"
    state: attached
    api_timeout: 120
  with_items: "{{ pve_retval.results }}"

- name: Proxmox - start nodes
  local_action:
    module: cs_instance
    name: "{{ item.name }}"
    project: "{{ build_project }}"
    zone: "{{ build_zone }}"
    state: started
    api_timeout: 120
  with_items: "{{ pve_retval.results }}"

- name: Proxmox - update inventory file with node IP addresses
  replace:
    dest="{{ inventory_dir }}/hosts_{{ env_name_clean }}"
    regexp='{{ item.name }}-ip'
    replace='{{ item.default_ip }}'
    backup=no
  with_items: "{{ pve_retval.results }}"

- name: Proxmox - update inventory file with node instance names
  replace:
    dest="{{ inventory_dir }}/hosts_{{ env_name_clean }}"
    regexp='{{ item.name }}-instance_name'
    replace='{{ item.instance_name }}'
    backup=no
  with_items: "{{ pve_retval.results }}"

- name: Proxmox - update in-memory inventory with node IP addresses
  add_host:
    name={{ item.name }}
    groups="proxmox_hosts"
    ansible_ssh_host={{ item.default_ip }}
    instance_name={{ item.instance_name }}
  with_items: "{{ pve_retval.results }}"
